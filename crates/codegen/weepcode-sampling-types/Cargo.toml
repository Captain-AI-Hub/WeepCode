[package]
license = "Apache-2.0"
name = "weepcode-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the WeepCode sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
weepcode-compaction = { path = "../../common/weepcode-compaction" }
weepcode-tools = { path = "../weepcode-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
