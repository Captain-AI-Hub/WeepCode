[package]
license = "Apache-2.0"
name = "weepcode-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Subagent configuration resolution: merges persona, role, and spawn-time overrides into a resolved spec"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
weepcode-sampling-types = { path = "../weepcode-sampling-types" }
weepcode-tools = { path = "../weepcode-tools" }
weepcode-tool-types.workspace = true
# TODO(phase2): add these when resolve_subagent_spec() composition is implemented:
# weepcode-agent = { path = "../weepcode-agent" }  # AgentDefinition lookup
# weepcode-fast-worktree = { path = "../weepcode-fast-worktree" }  # worktree creation

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
