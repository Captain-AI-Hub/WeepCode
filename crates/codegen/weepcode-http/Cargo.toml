[package]
license = "Apache-2.0"
name = "weepcode-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the weepcode CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
weepcode-auth = { workspace = true, features = ["middleware"] }
weepcode-sampler = { path = "../weepcode-sampler" }
weepcode-telemetry = { workspace = true }
weepcode-version = { workspace = true }
weepcode-workspace = { workspace = true }

[lints]
workspace = true
